<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog post | Jun-Ting (Tim) Hsieh</title>
    <meta name="description" content="A blog post by Jun-Ting (Tim) Hsieh.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22rgb(59, 130, 246)%22/><text x=%2250%22 y=%2255%22 font-family=%22Arial, sans-serif%22 font-weight=%22bold%22 font-size=%2245%22 fill=%22white%22 text-anchor=%22middle%22>JH</text></svg>">
    <link href="https://fonts.googleapis.com/css?family=Nunito:300,400,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <div class="brand">
                <a class="brand-name" href="../index.html">Jun-Ting (Tim) Hsieh</a>
                <span class="brand-section">/ Blog</span>
            </div>
            <nav class="site-nav" aria-label="Blog navigation">
                <a href="../index.html">Home</a>
                <a href="./">Blog</a>
            </nav>
        </div>
    </header>

    <main class="page post-layout">
        <article>
            <header id="article-header" class="article-header">
                <p class="status">Loading post...</p>
            </header>
            <div id="article-content" class="article-content"></div>
            <a class="back-link" href="./">&larr; All posts</a>
        </article>

        <aside id="toc" class="toc" aria-label="Table of contents" hidden>
            <div class="toc-title">Outline</div>
            <nav id="toc-links"></nav>
        </aside>
    </main>

    <script>

        // Marked interprets Markdown punctuation before MathJax gets a chance to
        // parse TeX. In particular, constructs such as \{...\}, \, and _ can
        // be altered. Stash math as inert placeholders while Markdown is parsed,
        // then restore the exact TeX source for MathJax.
        function protectMath(markdown) {
            const mathSegments = [];

            const stash = tex => {
                const token = `MATHPLACEHOLDER${mathSegments.length}X`;
                mathSegments.push(tex);
                return token;
            };

            let protectedMarkdown = markdown;

            // Display math first, so the inline-dollar pass cannot consume it.
            protectedMarkdown = protectedMarkdown.replace(/\$\$[\s\S]*?\$\$/g, stash);
            protectedMarkdown = protectedMarkdown.replace(/\\\[[\s\S]*?\\\]/g, stash);

            // TeX inline delimiters: \(...\).
            protectedMarkdown = protectedMarkdown.replace(/\\\([\s\S]*?\\\)/g, stash);

            // Dollar-delimited inline math. The prefix avoids treating an escaped
            // dollar sign as an opening delimiter. Escaped characters inside the
            // math span are consumed as a pair, so \$ does not terminate it.
            protectedMarkdown = protectedMarkdown.replace(
                /(^|[^\\])\$(?!\$)((?:\\.|[^$\n])*)\$/gm,
                (match, prefix, body) => prefix + stash(`$${body}$`)
            );

            return {
                markdown: protectedMarkdown,
                restore(html) {
                    return html.replace(/MATHPLACEHOLDER(\d+)X/g, (match, index) => {
                        const tex = mathSegments[Number(index)];
                        // Restore as text, not HTML. The browser decodes these
                        // entities back to the exact TeX characters for MathJax.
                        return tex
                            .replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;');
                    });
                }
            };
        }

        function formatDate(isoDate) {
            return new Intl.DateTimeFormat('en-US', {
                year: 'numeric', month: 'long', day: 'numeric'
            }).format(new Date(`${isoDate}T12:00:00`));
        }

        function slugify(text) {
            return text
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');
        }

        function styleAdmonitions(article) {
            article.querySelectorAll('blockquote').forEach(box => {
                const first = box.firstElementChild;
                if (!first || first.tagName !== 'P') return;

                const match = first.textContent.trim().match(/^\[!(NOTE|EXERCISE)\](?:\s+(.*))?$/i);
                if (!match) return;

                const type = match[1].toLowerCase();
                const title = match[2]?.trim() || (type === 'note' ? 'Note' : 'Exercise');
                box.classList.add(type === 'note' ? 'notebox' : 'exercisebox');
                first.classList.add('admonition-title');
                first.textContent = title;
            });
        }

        function buildToc(article) {
            const toc = document.getElementById('toc');
            const links = document.getElementById('toc-links');
            const headings = [...article.querySelectorAll('h2, h3, h4')];

            if (!headings.length) return;

            const usedIds = new Map();
            headings.forEach(heading => {
                const base = slugify(heading.textContent) || 'section';
                const count = usedIds.get(base) || 0;
                usedIds.set(base, count + 1);
                heading.id = count ? `${base}-${count + 1}` : base;
            });

            links.innerHTML = headings.map(heading => `
                <a class="toc-${heading.tagName.toLowerCase()}" href="#${heading.id}">${heading.textContent}</a>
            `).join('');
            toc.hidden = false;

            const tocAnchors = [...links.querySelectorAll('a')];
            const byId = new Map(tocAnchors.map(a => [a.getAttribute('href').slice(1), a]));

            const observer = new IntersectionObserver(entries => {
                for (const entry of entries) {
                    if (!entry.isIntersecting) continue;
                    tocAnchors.forEach(a => a.classList.remove('active'));
                    byId.get(entry.target.id)?.classList.add('active');
                }
            }, { rootMargin: '-15% 0px -75% 0px' });

            headings.forEach(heading => observer.observe(heading));
        }

        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const header = document.getElementById('article-header');
            const article = document.getElementById('article-content');

            if (!slug || !/^[a-z0-9-]+$/.test(slug)) {
                header.innerHTML = '<p class="error">Invalid or missing post slug.</p>';
                return;
            }

            try {
                const [manifestResponse, markdownResponse] = await Promise.all([
                    fetch('posts.json'),
                    fetch(`posts/${slug}.md`)
                ]);

                if (!manifestResponse.ok || !markdownResponse.ok) {
                    throw new Error('Post not found');
                }

                const posts = await manifestResponse.json();
                const post = posts.find(item => item.slug === slug);
                if (!post) throw new Error('Post metadata not found');

                const markdown = await markdownResponse.text();
                const protectedMath = protectMath(markdown);
                const rendered = marked.parse(protectedMath.markdown, { gfm: true, breaks: false });
                const sanitized = DOMPurify.sanitize(rendered);
                article.innerHTML = protectedMath.restore(sanitized);
                styleAdmonitions(article);

                document.title = `${post.title} | Jun-Ting (Tim) Hsieh`;
                header.innerHTML = `
                    <h1>${post.title}</h1>
                    <p class="article-description">${post.description}</p>
                    <div class="post-meta">${formatDate(post.date)}</div>
                `;

                buildToc(article);

                if (window.MathJax?.typesetPromise) {
                    await MathJax.typesetPromise([article, document.getElementById('toc')]);
                }
            } catch (error) {
                console.error(error);
                header.innerHTML = '<p class="error">Could not load this post.</p>';
            }
        }

        window.addEventListener('load', loadPost);
    </script>
</body>
</html>
